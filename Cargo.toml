[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/platform",
    "crates/net",
    "crates/daemon",
    "crates/gui",
]

[workspace.package]
version = "0.5.2"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/narf/tether"

[workspace.dependencies]
tether-proto = { path = "crates/proto" }
tether-core = { path = "crates/core" }
tether-platform = { path = "crates/platform" }
tether-net = { path = "crates/net" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TLS stack pinned to the `ring` provider so the build needs no cmake/nasm.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
rcgen = "0.13"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
