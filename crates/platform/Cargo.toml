[package]
name = "tether-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tether-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true }
# `image-data` is a default feature and is what gives us get_image/set_image.
arboard = "3"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# evdev and uinput, rather than X11 or a Wayland protocol: they sit below the
# display server, so one backend covers X11, Wayland and a bare console. The
# cost is a permission — reading /dev/input and writing /dev/uinput needs the
# `input` group or root — which is a one-line udev rule and the same trade
# every input tool on Linux makes.
evdev = "0.12"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
