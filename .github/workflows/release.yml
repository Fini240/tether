name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach artifacts to
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than separate arm64/x86_64 downloads —
          # it halves the ways a user can pick the wrong file, and the size
          # cost is a few megabytes.
          - name: macos-universal
            os: macos-14
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      # macOS gets the full treatment: universal binary, .app bundle, .dmg.
      - name: Build and bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/bundle.sh
          packaging/macos/bundle.sh "${{ steps.version.outputs.version }}"

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: cargo build --release --bin tether --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/tether-${{ steps.version.outputs.version }}-${{ matrix.name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" tether
          (cd dist && sha256sum ./*.tar.gz >SHA256SUMS)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          7z a "dist/tether-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip" \
            "./target/${{ matrix.target }}/release/tether.exe"
          (cd dist && sha256sum ./*.zip >SHA256SUMS)

      # Per-platform names: several jobs write a SHA256SUMS and artifact
      # uploads with the same name would clobber each other.
      - uses: actions/upload-artifact@v4
        with:
          name: tether-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts and merge checksums
        run: |
          mkdir -p dist
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' \) \
            -exec cp {} dist/ \;
          # Rebuild rather than concatenating the per-platform files: their
          # path columns come from three different build machines.
          (cd dist && sha256sum ./* >SHA256SUMS)
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            --prerelease \
            || gh release upload "$tag" dist/* --repo "${{ github.repository }}" --clobber
