name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach artifacts to
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than separate arm64/x86_64 downloads —
          # it halves the ways a user can pick the wrong file, and the size
          # cost is a few megabytes.
          - name: macos-universal
            os: macos-14
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      # macOS gets three things: Tether.app (menu bar front end with the
      # daemon bundled in), a .dmg wrapping it, and the bare signed CLI.
      - name: Build and bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/bundle.sh
          packaging/macos/bundle.sh "${{ steps.version.outputs.version }}"

      - name: Build (Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release --bin tether --bin tether-gui \
            --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="tether-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/tether.exe" "dist/$name/tether.exe"
          cp "target/${{ matrix.target }}/release/tether-gui.exe" "dist/$name/Tether.exe"
          cp packaging/README-WINDOWS.txt "dist/$name/README.txt"
          (cd dist && 7z a "$name.zip" "$name" && rm -rf "$name")
          (cd dist && sha256sum ./*.zip >SHA256SUMS)

      # Per-platform names: several jobs write a SHA256SUMS and artifact
      # uploads with the same name would clobber each other.
      - uses: actions/upload-artifact@v4
        with:
          name: tether-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts and merge checksums
        run: |
          mkdir -p dist
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          # Rebuild rather than concatenating the per-platform files: their
          # path columns come from three different build machines.
          (cd dist && sha256sum ./* >SHA256SUMS)
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # Retry: the GitHub API returns a transient 503 often enough that a
          # single attempt loses a whole release build to something that had
          # nothing to do with the code. The old `create || upload` fallback
          # made it worse — a 503 on create left upload reporting the useless
          # "release not found".
          publish() {
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$tag" dist/* --repo "${{ github.repository }}" --clobber
            else
              gh release create "$tag" dist/* \
                --repo "${{ github.repository }}" \
                --title "$tag" \
                --generate-notes \
                --prerelease
            fi
          }

          for attempt in 1 2 3 4 5; do
            if publish; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done

          echo "could not publish after 5 attempts" >&2
          exit 1
