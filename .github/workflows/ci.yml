name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The window depends on X11, Wayland and GL headers. The input backend
      # itself needs none of them — evdev and uinput are kernel interfaces and
      # pure Rust from here — so a machine that only wants the CLI does not
      # need any of this.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # The whole suite runs everywhere, including the end-to-end host/client
      # test: it uses the headless backend, so it needs no display, no
      # accessibility grant, and no second machine. Only the *native* backends
      # are platform-specific, and those are not exercised here.
      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --bin tether
