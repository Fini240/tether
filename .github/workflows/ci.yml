name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # arboard reaches for X11/Wayland clipboard protocols. Its backends are
      # pure Rust, but pkg-config still has to exist for the build script.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # The whole suite runs everywhere, including the end-to-end host/client
      # test: it uses the headless backend, so it needs no display, no
      # accessibility grant, and no second machine. Only the *native* backends
      # are platform-specific, and those are not exercised here.
      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --bin tether
